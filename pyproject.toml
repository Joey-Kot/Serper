[project]
name = "serper-toolkit"
version = "0.0.15"
description = "A high-performance, asynchronous MCP server for Serper Google Search, featuring connection pooling, request retries, and intelligent input parsing."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
keywords = ["serper", "mcp", "server", "google", "search"]
authors = [
    { name="Joey.Kot", email="joey.kot.x@gmail.com" },
]

dependencies = [
    "httpx>=0.28.1",
    "h2>=4.4.1",
    "idna>=3.15",
    "dotenv>=0.9.9",
    "python-dotenv>=1.2.2",
    "fastmcp>=3.4.2,<4",
    # Security floors for transitive dependencies also apply to pip/uvx installs.
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "cryptography>=50.0.2",
    "hpack>=4.2.0",
    "mcp>=1.30.0,<2",
    "opentelemetry-api>=1.45.1",
    "pyjwt>=2.15.1"
]

[project.scripts]
serper-toolkit = "serper_toolkit.__main__:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt", "THIRD_PARTY_LICENSES/*"]

[tool.setuptools.package-data]
serper_toolkit = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["serper_toolkit*"]
