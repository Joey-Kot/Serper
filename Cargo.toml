[package]
name = "serper"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
description = "A command-line client for Serper search, scraping, and account credits"
license = "MIT"
repository = "https://github.com/Joey-Kot/Serper"

[[bin]]
name = "serper"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = "4.6"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde_json = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
