name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  build-cli:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            os: linux
            arch: arm64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            os: windows
            arch: amd64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: darwin
            arch: amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Test on target platform
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify Linux executable is statically linked
        if: matrix.os == 'linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/serper"
          program_headers=$(readelf -lW "$binary")
          dynamic_section=$(readelf -dW "$binary")
          if grep -q 'INTERP' <<< "$program_headers" || grep -q '(NEEDED)' <<< "$dynamic_section"; then
            echo "Executable has a dynamic loader or shared-library dependency" >&2
            exit 1
          fi
      - name: Prepare package
        shell: bash
        run: |
          package="serper_${{ matrix.os }}_${{ matrix.arch }}"
          mkdir -p dist "staging/$package"
          cp README.md README_ZH.md LICENSE NOTICE "staging/$package/"
          binary=serper
          if [[ "${{ matrix.os }}" == windows ]]; then binary=serper.exe; fi
          cp "target/${{ matrix.target }}/release/$binary" "staging/$package/$binary"
      - name: Package Unix CLI
        if: matrix.os != 'windows'
        shell: bash
        run: tar -C staging -czf "dist/serper_${{ matrix.os }}_${{ matrix.arch }}.tar.gz" "serper_${{ matrix.os }}_${{ matrix.arch }}"
      - name: Package Windows CLI
        if: matrix.os == 'windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath staging/serper_${{ matrix.os }}_${{ matrix.arch }} -DestinationPath dist/serper_${{ matrix.os }}_${{ matrix.arch }}.zip
      - name: Verify package layout
        shell: pwsh
        run: |
          $package = 'serper_${{ matrix.os }}_${{ matrix.arch }}'
          if ('${{ matrix.os }}' -eq 'windows') {
            $archive = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD "dist/$package.zip"))
            try { $entries = @($archive.Entries | ForEach-Object { $_.FullName }) }
            finally { $archive.Dispose() }
            $binary = 'serper.exe'
          } else {
            $entries = @(tar -tzf "dist/$package.tar.gz")
            if ($LASTEXITCODE -ne 0) { throw 'Failed to list archive contents' }
            $binary = 'serper'
          }
          if (@($entries | Where-Object { -not $_.StartsWith("$package/") }).Count -ne 0) {
            throw 'Archive contains files outside the package directory'
          }
          foreach ($file in @('README.md', 'README_ZH.md', 'LICENSE', 'NOTICE', $binary)) {
            if ($entries -notcontains "$package/$file") { throw "Archive is missing $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: serper-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release-cli:
    runs-on: ubuntu-latest
    needs: build-cli
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: serper-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          for package in *; do sha256sum "$package" > "$package.sha256"; done
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS
      - name: Move Latest tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f Latest "$GITHUB_SHA"
          git push origin Latest --force
      - name: Ensure Latest release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view Latest >/dev/null 2>&1 || gh release create Latest --title "Latest" --notes "Latest CLI builds"
      - name: Upload CLI packages to Latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload Latest dist/* --clobber
